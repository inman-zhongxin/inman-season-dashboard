<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>茵曼品牌 · 季节导入分析仪表盘 v13</title>
<style>
:root{--pri:#87CECB;--pri-dark:#5BA7A4;--bg:#f4f6f9;--card:#ffffff;--text:#2d3748;--text2:#5a6a7e;--text3:#8b9aaf;--border:#e2e8f0;--radius:10px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);--shadow-hover:0 4px 12px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1460px;margin:0 auto;padding:20px 24px}

.header{background:linear-gradient(135deg,var(--pri)0%,var(--pri-dark)100%);color:#fff;padding:24px 32px;border-radius:var(--radius);margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.header h1{font-size:22px;font-weight:600;margin-bottom:4px}
.header .sub{font-size:13px;opacity:0.85}

.filter-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.fsep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}

.di-wrap{display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
.di-wrap label{font-size:11px;color:var(--text3);white-space:nowrap}
.di-wrap input[type="date"]{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--font);color:var(--text);background:#fff;width:124px;outline:none}
.di-wrap input[type="date"]:focus{border-color:var(--pri);box-shadow:0 0 0 2px rgba(135,206,203,0.15)}

.dropdown{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:var(--text);transition:all .15s;white-space:nowrap}
.dropdown:hover{border-color:var(--pri);background:#f0faf9}
.dropdown .arrow{font-size:8px;transition:transform .2s}
.dd-active{border-color:var(--pri)!important;background:#e8f7f6!important}

.dd-panel{position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:8px;z-index:100;min-width:260px;display:none}
.dd-panel.show{display:block}
.dd-wrap{position:relative;flex-shrink:0}
.dd-actions{display:flex;gap:4px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.dd-actions button{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:11px;cursor:pointer;color:var(--text2);transition:all .15s}
.dd-actions button:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.dd-tags{display:flex;flex-wrap:wrap;gap:4px;max-height:240px;overflow-y:auto}

.tag{display:inline-block;padding:3px 8px;border:1px solid var(--border);border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.tag:hover{border-color:var(--pri)}
.tag.on{background:var(--pri);color:#fff;border-color:var(--pri)}

.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.section-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:inline-block;width:4px;height:18px;background:var(--pri);border-radius:2px}
.section-subtitle{font-size:12px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.oc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.oc:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.oc.active{border-color:var(--pri)}
.oc.active::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--pri)}
.oc .sn{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.oc .row{display:flex;gap:12px;flex-wrap:wrap}
.oc .mv{font-size:17px;font-weight:700;line-height:1.2}
.oc .ml{font-size:10px;color:var(--text3);line-height:1.2}
.oc .mwrap{min-width:50px}

.tab-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab-btn{border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;background:#fff;color:var(--text2);transition:all .15s}
.tab-btn:hover{border-color:var(--pri);color:var(--pri)}
.tab-btn.active{background:var(--pri);color:#fff;border-color:var(--pri)}

.chart-wrap{position:relative;margin-top:8px;overflow-x:auto}
.chart-wrap svg{display:block}

.table-wrap{max-height:520px;overflow-y:auto;margin-top:8px}
.summary-table{width:100%;border-collapse:collapse;font-size:12px}
.summary-table thead{position:sticky;top:0;z-index:5}
.summary-table th{background:var(--pri-dark);color:#fff;padding:8px 10px;text-align:right;font-weight:500;font-size:11px}
.summary-table th:first-child{text-align:left;border-radius:6px 0 0 0}
.summary-table th:last-child{border-radius:0 6px 6px 0}
.summary-table td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border)}
.summary-table td:first-child{text-align:left;font-weight:500}
.store-header td{background:#f0faf9;font-weight:700;font-size:13px;color:var(--pri-dark);border-bottom:2px solid var(--pri)}
.store-subtotal td{background:#f7f7f7;font-weight:600;color:var(--pri-dark);border-top:1px solid var(--border)}
.store-subtotal td:first-child{padding-left:20px}
.summary-table tr:hover td{background:#f8fbfe}
.store-header:hover td{background:#e6f5f4!important}
.diff-pos{color:#10b981;font-weight:600}
.diff-neg{color:#ef4444;font-weight:600}
.diff-zero{color:var(--text3)}

.ax{font-size:11px;fill:var(--text2)}
.stl{font-size:10px;fill:var(--text2)}

.footer{text-align:center;font-size:11px;color:var(--text3);padding:16px}
</style>
</head>

// ★ MM-DD based filtering (year-agnostic)
function getEffDaily(monthsArr,dateFrom,dateTo){
  var dfMM=(dateFrom||'2026-01-01').substring(5);
  var dtMM=(dateTo||'2026-12-31').substring(5);
  var r=[];
  dailyRaw.forEach(function(x){var xMM=x.d.substring(5);if(monthsArr.indexOf(x.m)>=0&&xMM>=dfMM&&xMM<=dtMM)r.push(x);});
  return r;
}

function dailyToMonthSeason(dd){
  var map={},mt={};
  dd.forEach(function(x){var k=x.y+'|'+x.s+'|'+x.m;if(!map[k])map[k]={};var sm=map[k];if(!sm[x.se])sm[x.se]={a:0,ta:0};sm[x.se].a+=x.a;sm[x.se].ta=Math.max(sm[x.se].ta,x.ta);var mk=x.y+'|'+x.s+'|'+x.m;mt[mk]=(mt[mk]||0)+x.a;});
  var r=[];
  for(var k in map){var p=k.split('|');var y=parseInt(p[0]),s=p[1],m=parseInt(p[2]);var t=mt[(y+'|'+s+'|'+m)]||0;var sm=map[k];for(var se in sm){if(SEASONS.indexOf(se)<0)continue;r.push({y:y,s:s,m:m,se:se,a:sm[se].a,ta:t,p:t>0?(sm[se].a/t*100):0});}}
  return r;
}

function getEffMonthly(monthsArr,df,dt){
  var usePre=true;
  monthsArr.forEach(function(m){
    var dm=MONTH_DATE_MAP[m];
    if(!dm){usePre=false;return;}
    var dfMM=(df||'2026-01-01').substring(5),dtMM=(dt||'2026-12-31').substring(5);
    if(dfMM>dm.from||dtMM<dm.to)usePre=false;
  });
  if(usePre){var r=[];monthlyRaw.forEach(function(x){if(monthsArr.indexOf(x.m)>=0)r.push(x);});return r;}
  return dailyToMonthSeason(getEffDaily(monthsArr,df,dt));
}

function getEffMonthlyRaw(monthsArr){
  var r=[];monthlyRaw.forEach(function(x){if(monthsArr.indexOf(x.m)>=0)r.push(x);});return r;
}

function tagClick(fn,val){
  event.stopPropagation();var arr=getFilterArr(fn);var idx=arr.indexOf(val);
  if(idx>=0)arr.splice(idx,1);else arr.push(val);
  arr.sort(function(a,b){return a-b;});updateFilterUI(fn);
  if(fn==='globalMonth')syncGlobalDates();
  if(fn==='summMonth')syncSummDates();
  refreshAll();
}
function selAll(fn){event.stopPropagation();setFilterArr(fn,getAllOptions(fn).slice());updateFilterUI(fn);if(fn==='globalMonth')syncGlobalDates();if(fn==='summMonth')syncSummDates();refreshAll();}

function getAllOptions(fn){
  if(fn==='globalMonth'||fn==='summMonth')return ALL_MONTHS;
  if(fn==='autumnWeek')return ALL_DW;
  if(fn==='autumnStore')return STORES;
  if(fn==='autumnSeason')return SEASONS;

}

  if(fn==='autumnWeek')return autumnWeeks;
  if(fn==='autumnStore')return autumnStores;
  if(fn==='autumnSeason')return autumnSeasons;

  return[];
}
function setFilterArr(fn,arr){
  if(fn==='globalMonth')globalMonths=arr.slice();
  else if(fn==='autumnWeek')autumnWeeks=arr.slice();
  else if(fn==='autumnStore')autumnStores=arr.slice();
  else if(fn==='autumnSeason')autumnSeasons=arr.slice();
  else if(fn==='summMonth')summMonths=arr.slice();
}
function updateFilterUI(fn){
  var arr=getFilterArr(fn),all=getAllOptions(fn);
  document.getElementById(fn+'Cnt').textContent=arr.length+'/'+all.length;
  var cap=fn.charAt(0).toUpperCase()+fn.slice(1),t=document.getElementById('dd'+cap);
  if(arr.length===all.length)t.classList.remove('dd-active');else t.classList.add('dd-active');
  var tags=document.getElementById(fn+'Tags'),h='';
  all.forEach(function(v){var label=fn==='autumnWeek'?('W'+v):(fn.includes('Month')?(v+'月'):v);var vq=(typeof v==='number')?v:("'"+v+"'");h+='<span class="tag'+(arr.indexOf(v)>=0?' on':'')+'" onclick="tagClick(\''+fn+'\','+vq+')">'+label+'</span>';});
  tags.innerHTML=h;
}

function syncGlobalDates(){
  var m=globalMonths.slice().sort(function(a,b){return a-b;});if(m.length===0)return;
  var y1=(m[0]<=7)?'2026':'2025',y2=(m[m.length-1]<=7)?'2026':'2025';
  globalDF=y1+'-'+MONTH_DATE_MAP[m[0]].from;globalDT=y2+'-'+MONTH_DATE_MAP[m[m.length-1]].to;
  document.getElementById('globalDateFrom').value=globalDF;document.getElementById('globalDateTo').value=globalDT;
}
function syncSummDates(){
  var m=summMonths.slice().sort(function(a,b){return a-b;});if(m.length===0)return;
  var y1=(m[0]<=7)?'2026':'2025',y2=(m[m.length-1]<=7)?'2026':'2025';
  summDF=y1+'-'+MONTH_DATE_MAP[m[0]].from;summDT=y2+'-'+MONTH_DATE_MAP[m[m.length-1]].to;
  document.getElementById('summDateFrom').value=summDF;document.getElementById('summDateTo').value=summDT;
}
function onGlobalDateChange(){globalDF=document.getElementById('globalDateFrom').value;globalDT=document.getElementById('globalDateTo').value;refreshAll();}
function onSummDateChange(){summDF=document.getElementById('summDateFrom').value;summDT=document.getElementById('summDateTo').value;refreshSummary();}

// ===== INIT =====
function init(){
  var th='';STORES.forEach(function(s){th+='<button class="tab-btn'+(s===currentStore?' active':'')+'" onclick="switchStore(\''+s+'\')">'+s+'</button>';});
  document.getElementById('tabs').innerHTML=th;
  ['globalMonth','autumnWeek','autumnStore','autumnSeason','summMonth'].forEach(function(f){updateFilterUI(f);});
  syncGlobalDates();syncSummDates();refreshAll();
}
function switchStore(s){currentStore=s;var btns=document.querySelectorAll('.tab-btn');btns.forEach(function(b){b.classList.remove('active');if(b.textContent===s)b.classList.add('active');});refreshAll();}

// ★ VITAL: refreshAll with try-catch to prevent cascade failures
function refreshAll(){
  try{updateOverview();}catch(e){console.error('updateOverview:',e);}
  try{renderMonthlyChart();}catch(e){console.error('renderMonthlyChart:',e);}
  try{renderWeeklyChart();}catch(e){console.error('renderWeeklyChart:',e);}
  try{renderAutumnChart();}catch(e){console.error('renderAutumnChart:',e);}
  try{refreshSummary();}catch(e){console.error('refreshSummary:',e);}
}
function refreshSummary(){renderSummaryTable();}

// ===== OVERVIEW =====
function updateOverview(){
  var gm=globalMonths,eff=getEffMonthly(gm,globalDF,globalDT);
  var stsum='';
  STORES.forEach(function(s){
    var d25=eff.filter(function(r){return r.s===s&&r.y===2025;});
    var d26=eff.filter(function(r){return r.s===s&&r.y===2026;});
    var t25=0,t26=0,mm25={},mm26={};
    d25.forEach(function(r){mm25[r.m]=Math.max(mm25[r.m]||0,r.ta);});
    d26.forEach(function(r){mm26[r.m]=Math.max(mm26[r.m]||0,r.ta);});
    for(var k in mm25)t25+=mm25[k];for(var k in mm26)t26+=mm26[k];
    var g=t25>0?((t26-t25)/t25*100):0,gcls=g>0?'diff-pos':(g<0?'diff-neg':'diff-zero');
    var act=(s===currentStore)?' active':'';
    stsum+='<div class="oc'+act+'" onclick="switchStore(\''+s+'\')" id="oc_'+STORES.indexOf(s)+'">'+
      '<div class="sn">'+s+'</div><div class="row">'+
      '<div class="mwrap"><div class="mv">'+fmtA(t26)+'</div><div class="ml">2026 销售额</div></div>'+
      '<div class="mwrap"><div class="mv '+gcls+'">'+(g>=0?'+':'')+g.toFixed(1)+'%</div><div class="ml">vs 2025同比</div></div>'+
      '</div></div>';
  });
  document.getElementById('overview').innerHTML=stsum;
  var ac=document.getElementById('oc_'+STORES.indexOf(currentStore));if(ac)ac.classList.add('active');
}

// ===== MONTHLY 100% STACKED =====
function renderMonthlyChart(){
  var store=currentStore,gm=globalMonths;
  var eff=getEffMonthly(gm,globalDF,globalDT).filter(function(r){return r.s===store;});
  var months=gm.filter(function(m){return eff.some(function(r){return r.m===m;});}).sort(function(a,b){return a-b;});
  if(months.length===0){document.getElementById('monthlySvg').innerHTML='<p style="color:var(--text3);padding:20px">无数据</p>';return;}
  var d25={},d26={};SEASONS.forEach(function(se){d25[se]={};d26[se]={};});
  eff.forEach(function(r){var map=r.y===2025?d25:d26;if(map[r.se])map[r.se][r.m]=r.p;});
  var nm=months.length,pad={top:30,right:20,bottom:60,left:52},ch=440;
  var barW=32,gapY=10,gapM=28,perM=barW*2+gapY,cw=perM*nm+gapM*(nm-1);
  function yPos(v){return pad.top+(100-v)/100*(ch-pad.top-pad.bottom);}
  var svgW=Math.max(680,cw+pad.left+pad.right+60);
  var svg='<svg width="'+svgW+'" height="'+(ch+60)+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<=10;i++){var v=i*10,y=yPos(v);svg+='<line x1="'+pad.left+'" y1="'+y+'" x2="'+(pad.left+cw)+'" y2="'+y+'" stroke="#e8ecf0" stroke-dasharray="4,4"/><text class="ax" x="'+(pad.left-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'%</text>';}
  months.forEach(function(m,mi){
    var xb=pad.left+mi*(perM+gapM);
    var acc25=0;SEASONS.forEach(function(se){var p=d25[se][m]||0;if(p<=0.05){acc25+=p;return;}var yt=yPos(acc25+p),yb=yPos(acc25),h=yb-yt;svg+='<rect x="'+xb+'" y="'+yt+'" width="'+barW+'" height="'+Math.max(0.5,h)+'" fill="'+C[se]+'" opacity="0.35" rx="2"><title>2025 '+se+' '+m+'月: '+p.toFixed(1)+'%</title></rect>';acc25+=p;});
    var acc26=0;SEASONS.forEach(function(se){var p=d26[se][m]||0;if(p<=0.05){acc26+=p;return;}var yt=yPos(acc26+p),yb=yPos(acc26),h=yb-yt;svg+='<rect x="'+(xb+barW+gapY)+'" y="'+yt+'" width="'+barW+'" height="'+Math.max(0.5,h)+'" fill="'+C[se]+'" opacity="0.85" rx="2"><title>2026 '+se+' '+m+'月: '+p.toFixed(1)+'%</title></rect>';acc26+=p;});
    svg+='<text class="stl" x="'+(xb+barW+gapY/2)+'" y="'+(ch-pad.bottom+18)+'" text-anchor="middle" font-size="12">'+m+'月</text>';
  });
  var lx=pad.left+4,ly=ch-pad.bottom+38;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="#ccc" opacity="0.3" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">2025</text>';lx+=60;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="#666" opacity="0.7" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">2026</text>';lx+=60;
  SEASONS.forEach(function(se){svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="'+C[se]+'" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">'+se+'</text>';lx+=48;});
  svg+='</svg>';
  document.getElementById('monthlyChartTitle').textContent=store+' · '+gm.length+'个月 · '+globalDF.substring(5)+'~'+globalDT.substring(5);
  document.getElementById('monthlySvg').innerHTML=svg;
}

// ===== WEEKLY 100% STACKED =====
function renderWeeklyChart(){
  var store=currentStore,gm=globalMonths,aw=[];
  ALL_WEEKS.forEach(function(w){var wm=WEEK_TO_MONTH[w];if(wm&&gm.indexOf(wm)>=0)aw.push(w);});
  aw.sort(function(a,b){return a-b;});
  if(aw.length===0){document.getElementById('weeklySvg').innerHTML='<p style="color:var(--text3);padding:20px">无周数据</p>';return;}
  var sw=weeklyRaw.filter(function(r){return r.s===store&&aw.indexOf(r.w)>=0;});
  if(sw.length===0){document.getElementById('weeklySvg').innerHTML='<p style="color:var(--text3);padding:20px">该店铺无周数据</p>';return;}
  var wd={};sw.forEach(function(r){if(!wd[r.w])wd[r.w]={};wd[r.w][r.se]=r.p;});
  var weeks=aw.filter(function(w){return wd[w];}),nw=weeks.length;
  var pad={top:30,right:20,bottom:60,left:52},ch=440,barW=14,gapW=12,cw=nw*barW+(nw-1)*gapW;
  function yPos(v){return pad.top+(100-v)/100*(ch-pad.top-pad.bottom);}
  var svgW=Math.max(680,cw+pad.left+pad.right+60);
  var svg='<svg width="'+svgW+'" height="'+(ch+60)+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<=10;i++){var v=i*10,y=yPos(v);svg+='<line x1="'+pad.left+'" y1="'+y+'" x2="'+(pad.left+cw)+'" y2="'+y+'" stroke="#e8ecf0" stroke-dasharray="4,4"/><text class="ax" x="'+(pad.left-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'%</text>';}
  weeks.forEach(function(w,wi){
    var xb=pad.left+wi*(barW+gapW),acc=0,dd=wd[w]||{};
    SEASONS.forEach(function(se){var p=dd[se]||0;if(p<=0.05){acc+=p;return;}var yt=yPos(acc+p),yb=yPos(acc),h=yb-yt;svg+='<rect x="'+xb+'" y="'+yt+'" width="'+barW+'" height="'+Math.max(0.5,h)+'" fill="'+C[se]+'" opacity="0.85" rx="1"><title>2026 W'+w+' '+se+': '+p.toFixed(1)+'%</title></rect>';acc+=p;});
    svg+='<text class="stl" x="'+(xb+barW/2)+'" y="'+(ch-pad.bottom+16)+'" text-anchor="middle" font-size="11">W'+w+'</text>';
  });
  var lx=pad.left+4,ly=ch-pad.bottom+36;
  SEASONS.forEach(function(se){svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="'+C[se]+'" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">'+se+'</text>';lx+=48;});
  svg+='</svg>';
  document.getElementById('weeklyChartTitle').textContent=store+' · 2026年 · '+nw+'周 · 周度季节占比';
  document.getElementById('weeklySvg').innerHTML=svg;
}

// ===== AUTUMN WEEKLY (DISPLAY-WEEK BARS WITH DATE RANGES) =====
function renderAutumnChart(){
  var aw=autumnWeeks,as=autumnStores,ase=autumnSeasons;
  if(aw.length===0||as.length===0||ase.length===0){
    document.getElementById('autumnSvg').innerHTML='<p style="color:var(--text3);padding:20px">请选择至少一个周、店铺和季节</p>';
    return;
  }
  // Filter dwRaw by selected weeks, stores, seasons
  var edw=dwRaw.filter(function(r){return aw.indexOf(r.w)>=0&&as.indexOf(r.s)>=0&&ase.indexOf(r.se)>=0;});
  
  var weeks=aw.slice().sort(function(a,b){return a-b;}).filter(function(w){return edw.some(function(r){return r.w===w;});});
  var stores=as;
  if(weeks.length===0){document.getElementById('autumnSvg').innerHTML='<p style="color:var(--text3);padding:20px">所选条件下无数据</p>';return;}
  
  var nw=weeks.length,ns=stores.length;
  var pad={top:20,right:16,bottom:90,left:50},ch=460;
  var barW=10,groupGap=18,gap=4;
  var perWeekW=ns*(barW*2+gap)+groupGap;
  var cw=perWeekW*nw;
  
  function yPos(v){return pad.top+(100-v)/100*(ch-pad.top-pad.bottom);}
  
  var svgW=Math.max(680,cw+pad.left+pad.right+80);
  var svg='<svg width="'+svgW+'" height="'+(ch+40)+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<=5;i++){var v=i*20,y=yPos(v);svg+='<line x1="'+pad.left+'" y1="'+y+'" x2="'+(pad.left+cw)+'" y2="'+y+'" stroke="#e8ecf0" stroke-dasharray="3,3"/><text class="ax" x="'+(pad.left-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'%</text>';}
  
  weeks.forEach(function(w,wi){
    stores.forEach(function(store,si){
      var p25=0,p26=0;
      edw.forEach(function(r){if(r.w===w&&r.s===store){if(r.y===2025)p25+=r.p;else p26+=r.p;}});
      var idx=wi*ns+si;
      var x=pad.left+wi*perWeekW+si*(barW*2+gap);
      // 2025 bar (left, lighter)
      var h25=yPos(p25),rh25=ch-pad.bottom-h25;
      svg+='<rect x="'+x+'" y="'+(rh25>0?h25:ch-pad.bottom)+'" width="'+barW+'" height="'+Math.max(1,rh25)+'" fill="#D4B896" opacity="0.5" rx="1"><title>2025 '+store+' W'+w+': '+p25.toFixed(1)+'%</title></rect>';
      // 2026 bar (right, darker)
      var h26=yPos(p26),rh26=ch-pad.bottom-h26;
      svg+='<rect x="'+(x+barW+gap)+'" y="'+(rh26>0?h26:ch-pad.bottom)+'" width="'+barW+'" height="'+Math.max(1,rh26)+'" fill="#D49A4A" rx="1"><title>2026 '+store+' W'+w+': '+p26.toFixed(1)+'%</title></rect>';
    });
    // Week label with date range
    var wMid=pad.left+wi*perWeekW+perWeekW/2;
    var wdr=WEEK_DATE_RANGE[w]||{};
    var wLabel='W'+w;
    if(wdr.from)wLabel+=' ('+wdr.from.substring(0,5)+')';
    svg+='<text class="stl" x="'+wMid+'" y="'+(ch-pad.bottom+6)+'" text-anchor="end" font-size="10" transform="rotate(-40,'+wMid+','+(ch-pad.bottom+6)+')">'+wLabel+'</text>';
  });
  
  // Store legend at bottom
  var lx=pad.left,ly=ch-pad.bottom+60;
  stores.forEach(function(store,si){
    var sc=['#D4B896','#D49A4A','#87CECB','#E08878'][si%4];
    svg+='<rect x="'+lx+'" y="'+ly+'" width="12" height="12" fill="'+sc+'" rx="2"/><text class="stl" x="'+(lx+15)+'" y="'+(ly+10)+'">'+store+'</text>';
    lx+=store.length*11+30;
  });
  
  svg+='</svg>';
  
  // ★ FIXED: ase (autumn seasons) instead of undefined "seasons"
  var mDesc='',wDesc='';
  ase.forEach(function(s){mDesc+=s+' ';});
  if(weeks.length>0){
    var dr=WEEK_DATE_RANGE[weeks[0]]||{},dr2=WEEK_DATE_RANGE[weeks[weeks.length-1]]||{};
    if(dr.from)wDesc=dr.from+'~'+(dr2.to||dr.to);
  }
  document.getElementById('autumnChartTitle').textContent='秋季导入进度 · 周度追踪 · '+stores.join('/')+' · '+weeks.length+'周 · '+mDesc;
  document.getElementById('autumnSvg').innerHTML=svg;
  document.getElementById('autumnDateLabel').textContent=wDesc?' 日期范围: '+wDesc:'';
}

// ===== SUMMARY TABLE (with 同比变化 column) =====
function renderSummaryTable(){
  var sm=summMonths,eff=getEffMonthly(sm,summDF,summDT);
  var h='<table class="summary-table"><thead><tr><th>店铺</th><th>季节</th><th>2025销售金额</th><th>2025占比</th><th>2026销售金额</th><th>2026占比</th><th>占比变化</th><th>同比变化</th></tr></thead><tbody>';
  
  STORES.forEach(function(store){
    var d25=eff.filter(function(r){return r.s===store&&r.y===2025;});
    var d26=eff.filter(function(r){return r.s===store&&r.y===2026;});
    var mm25={},mm26={},t25=0,t26=0;
    d25.forEach(function(r){mm25[r.m]=Math.max(mm25[r.m]||0,r.ta);});
    d26.forEach(function(r){mm26[r.m]=Math.max(mm26[r.m]||0,r.ta);});
    for(var k in mm25)t25+=mm25[k];for(var k in mm26)t26+=mm26[k];
    
    h+='<tr class="store-header"><td colspan="8">'+store+'</td></tr>';
    SEASONS.forEach(function(se){
      var a25=0,a26=0;d25.forEach(function(r){if(r.se===se)a25+=r.a;});d26.forEach(function(r){if(r.se===se)a26+=r.a;});
      var p25=t25>0?(a25/t25*100):0,p26=t26>0?(a26/t26*100):0;
      var diff=p26-p25,dcls=diff>0.1?'diff-pos':(diff<-0.1?'diff-neg':'diff-zero');
      var yoy=a25>0?((a26-a25)/a25*100):0;
      var ycls=yoy>0.1?'diff-pos':(yoy<-0.1?'diff-neg':'diff-zero');
      h+='<tr><td></td><td>'+se+'</td>'+
        '<td>'+fmtK(a25)+'</td><td>'+p25.toFixed(1)+'%</td>'+
        '<td>'+fmtK(a26)+'</td><td>'+p26.toFixed(1)+'%</td>'+
        '<td class="'+dcls+'">'+(diff>=0?'+':'')+diff.toFixed(1)+'pp</td>'+
        '<td class="'+ycls+'">'+(yoy>=0?'+':'')+yoy.toFixed(1)+'%</td></tr>';
    });
    var totG=t25>0?((t26-t25)/t25*100):0;
    var tgCls=totG>0.1?'diff-pos':(totG<-0.1?'diff-neg':'diff-zero');
    var yoyStr=t25>0?('同比 '+(totG>=0?'+':'')+totG.toFixed(1)+'%'):'新店·无同比';
    h+='<tr class="store-subtotal"><td>Σ 合计</td><td></td><td>'+fmtK(t25)+'</td><td>100.0%</td><td>'+fmtK(t26)+'</td><td>100.0%</td><td class="'+tgCls+'">'+yoyStr+'</td><td></td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('summaryTableWrap').innerHTML=h;
  document.getElementById('summaryTableSubtitle').textContent=summDF+' ~ '+summDT+' · 同期对比';
}

document.addEventListener('DOMContentLoaded',function(){init();});
document.addEventListener('click',function(e){if(!e.target.closest('.dd-wrap'))closeAllDropdowns();});
