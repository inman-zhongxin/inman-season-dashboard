<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茵曼品牌 · 季节导入分析仪表盘</title>
<style>
:root {
  --pri: #87CECB;
  --pri-dark: #5BA7A4;
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #2d3748;
  --text2: #5a6a7e;
  --text3: #8b9aaf;
  --border: #e2e8f0;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
}
* { margin:0;padding:0;box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.5; }
.container { max-width:1400px; margin:0 auto; padding:20px 24px; }

.header { background:linear-gradient(135deg, var(--pri) 0%, var(--pri-dark) 100%); color:#fff; padding:24px 32px; border-radius:var(--radius); margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.header h1 { font-size:22px; font-weight:600; margin-bottom:4px; }
.header .sub { font-size:13px; opacity:0.85; }

/* Filter bar */
.filter-bar { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.filter-bar .flabel { font-size:13px; font-weight:600; color:var(--text2); white-space:nowrap; }

/* Dropdown trigger */
.dd-trigger { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border:1px solid var(--border); border-radius:6px; font-size:12px; cursor:pointer; background:#fff; color:var(--text); transition:all .15s; white-space:nowrap; }
.dd-trigger:hover { border-color:var(--pri); background:#f0faf9; }
.dd-trigger .arrow { font-size:8px; transition:transform .2s; }
.dd-active { border-color:var(--pri)!important; background:#e8f7f6!important; }

.dd-panel { position:absolute; top:100%; left:0; margin-top:4px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.12); padding:8px; z-index:100; min-width:240px; display:none; }
.dd-panel.show { display:block; }
.dd-wrap { position:relative; flex-shrink:0; }
.dd-actions { display:flex; gap:4px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.dd-actions button { flex:1; padding:4px 8px; border:1px solid var(--border); border-radius:4px; background:#fff; font-size:11px; cursor:pointer; color:var(--text2); transition:all .15s; }
.dd-actions button:hover { background:var(--pri); color:#fff; border-color:var(--pri); }
.dd-tags { display:flex; flex-wrap:wrap; gap:4px; max-height:240px; overflow-y:auto; }

.tag { display:inline-block; padding:3px 8px; border:1px solid var(--border); border-radius:4px; font-size:11px; cursor:pointer; transition:all .15s; user-select:none; white-space:nowrap; }
.tag:hover { border-color:var(--pri); }
.tag.on { background:var(--pri); color:#fff; border-color:var(--pri); }

/* Section */
.section { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:20px; box-shadow:var(--shadow); }
.section-title { font-size:15px; font-weight:600; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.section-title::before { content:''; display:inline-block; width:4px; height:18px; background:var(--pri); border-radius:2px; }
.section-subtitle { font-size:12px; color:var(--text3); margin-bottom:16px; }

/* Overview cards */
.overview { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.oc { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; cursor:pointer; transition:all .2s; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.oc:hover { box-shadow:var(--shadow-hover); transform:translateY(-1px); }
.oc.active { border-color:var(--pri); }
.oc.active::before { content:''; position:absolute; top:0;left:0;right:0;height:3px; background:var(--pri); }
.oc .sn { font-size:12px; color:var(--text2); margin-bottom:6px; }
.oc .metrics { display:flex; gap:16px; font-size:12px; }
.oc .mval { font-size:18px; font-weight:700; }
.oc .mlabel { font-size:10px; color:var(--text3); }
.oc .growth { font-size:11px; font-weight:600; }

/* Charts */
.chart-wrap { position:relative; margin-top:8px; overflow-x:auto; }
.chart-wrap svg { display:block; }

/* Summary table */
.table-wrap { max-height:520px; overflow-y:auto; margin-top:8px; }
.summary-table { width:100%; border-collapse:collapse; font-size:12px; }
.summary-table thead { position:sticky; top:0; z-index:5; }
.summary-table th { background:var(--pri-dark); color:#fff; padding:8px 10px; text-align:right; font-weight:500; font-size:11px; }
.summary-table th:first-child { text-align:left; border-radius:6px 0 0 0; }
.summary-table th:last-child { border-radius:0 6px 0 0; }
.summary-table td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--border); }
.summary-table td:first-child { text-align:left; font-weight:500; }
.summary-table .store-header td { background:#f0faf9; font-weight:700; font-size:13px; color:var(--pri-dark); border-bottom:2px solid var(--pri); }
.summary-table .store-subtotal td { background:#f7f7f7; font-weight:600; color:var(--pri-dark); border-top:1px solid var(--border); }
.summary-table .store-subtotal td:first-child { padding-left:20px; }
.summary-table tr:hover td { background:#f8fbfe; }
.store-header:hover td { background:#e6f5f4!important; }
.diff-pos { color:#10b981; font-weight:600; }
.diff-neg { color:#ef4444; font-weight:600; }
.diff-zero { color:var(--text3); }

.ax { font-size:11px; fill:var(--text2); }
.tt { font-size:11px; fill:var(--text); font-weight:500; }
.stl { font-size:10px; fill:var(--text2); }

/* Store tabs */
.tabs { display:flex; gap:0; margin-bottom:12px; flex-wrap:wrap; }
.tab-btn { padding:8px 16px; border:1px solid var(--border); background:#fff; font-size:13px; cursor:pointer; transition:all .15s; font-family:var(--font); }
.tab-btn:first-child { border-radius:6px 0 0 6px; }
.tab-btn:last-child { border-radius:0 6px 6px 0; }
.tab-btn:not(:first-child) { margin-left:-1px; }
.tab-btn:hover { background:#f0faf9; }
.tab-btn.active { background:var(--pri); color:#fff; border-color:var(--pri); z-index:1; }

.footer { text-align:center; font-size:11px; color:var(--text3); padding:16px; }
.filter-overlay { position:fixed; top:0;left:0;right:0;bottom:0; z-index:99; display:none; }

/* Week summary under chart */
.week-summary { margin-top:10px; padding:8px 12px; background:#f8fbfe; border-radius:6px; font-size:11px; color:var(--text2); }
.week-summary span { margin-right:16px; }

@media (max-width:768px) {
  .overview { grid-template-columns:repeat(2,1fr); }
  .container { padding:12px; }
}
</style>
</head>

// Compute week-season totals from effective data
function computeWeekSeason(effData) {
  var map = {};
  effData.forEach(function(r) {
    var key = r.y+'|'+r.s+'|'+r.w;
    if (!map[key]) map[key] = {};
    var sm = map[key];
    if (!sm[r.se]) sm[r.se] = {a:0,ta:0};
    sm[r.se].a += r.a;
    sm[r.se].ta = Math.max(sm[r.se].ta, r.ta);
  });
  var result = [];
  for (var k in map) {
    var parts = k.split('|');
    var y = parseInt(parts[0]), s = parts[1], w = parseInt(parts[2]);
    var sm = map[k];
    for (var se in sm) {
      if (SEASONS.indexOf(se) < 0 && se !== '全季' && se !== '未分类') continue;
      var total = sm[se].ta, amt = sm[se].a;
      result.push({y:y, s:s, w:w, se:se, a:amt, ta:total, p:total>0?(amt/total*100):0});
    }
  }
  return result;
}

// === Get available weeks for selected months ===
function getAvailableWeeksForMonths(monthsArr) {
  var available = [];
  monthsArr.forEach(function(m) {
    var monthWeeks = MONTH_TO_WEEKS[m] || [];
    monthWeeks.forEach(function(w) {
      if (available.indexOf(w) < 0) available.push(w);
    });
  });
  available.sort(function(a,b){return a-b;});
  return available;
}

// === Cascading: when months change, adjust weeks ===
function cascadeMonthsToWeeks(prefix) {
  var monthsArr = getFilterArr(prefix+'Month');
  var weeksArr = getFilterArr(prefix+'Week');
  var available = getAvailableWeeksForMonths(monthsArr);
  // Filter weeks to only include those available
  var newWeeks = [];
  weeksArr.forEach(function(w) {
    if (available.indexOf(w) >= 0) newWeeks.push(w);
  });
  setFilterArr(prefix+'Week', newWeeks);
  // Update UI for both
  updateFilterUI(prefix+'Month');
  updateFilterUI(prefix+'Week');
}

function tagClick(filterName, val) {
  event.stopPropagation();
  var arr = getFilterArr(filterName);
  var idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  // Cascade: if month filter changed, adjust week filter
  if (filterName === 'globalMonth' || filterName === 'summMonth') {
    cascadeMonthsToWeeks(filterName === 'globalMonth' ? 'global' : 'summ');
  } else {
    updateFilterUI(filterName);
  }
  refreshAll();
}

function selAll(filterName) {
  event.stopPropagation();
  var arr = getFilterArr(filterName);
  var all = getAllOptions(filterName);
  for (var i=0;i<all.length;i++) arr.push(all[i]);
  arr.sort(); var u=[];
  for (var i=0;i<arr.length;i++) if (i===0 || arr[i]!==arr[i-1]) u.push(arr[i]);
  setFilterArr(filterName, u);
  // Cascade for month filters
  if (filterName === 'globalMonth' || filterName === 'summMonth') {
    cascadeMonthsToWeeks(filterName === 'globalMonth' ? 'global' : 'summ');
  } else {
    updateFilterUI(filterName);
  }
  refreshAll();
}

  if (filterName === 'globalWeek') return getAvailableWeeksForMonths(globalMonths);
  if (filterName === 'summWeek') return getAvailableWeeksForMonths(summMonths);
  if (filterName === 'autumnWeek') return ALL_WEEKS.filter(function(w){return w>=23 && w<=31});
  if (filterName === 'autumnStore') return STORES;

  if (filterName === 'autumnStore') return autumnStores;

  if (filterName === 'summMonth') return summMonths;
  if (filterName === 'summWeek') return summWeeks;

function setFilterArr(filterName, arr) {
  if (filterName === 'globalMonth') globalMonths=arr;
  else if (filterName === 'globalWeek') globalWeeks=arr;
  else if (filterName === 'autumnWeek') autumnWeeks=arr;
  else if (filterName === 'autumnStore') autumnStores=arr;
  else if (filterName === 'autumnSeason') autumnSeasons=arr;
  else if (filterName === 'summMonth') summMonths=arr;
  else if (filterName === 'summWeek') summWeeks=arr;

      var h = yBottom - yTop;
      svg+='<rect x="'+xBase+'" y="'+yTop+'" width="'+barW+'" height="'+Math.max(0.5,h)+'" fill="'+C[se]+'" opacity="0.35" rx="1">'+
        '<title>2025 '+se+' W'+w+': '+p.toFixed(1)+'%</title></rect>';
      acc25 += p;
    });
    
    // ---- 2026 stacked bar (opacity 0.85) ----
    var acc26 = 0;
    SEASONS.forEach(function(se){
      var p = data26[se][w] || 0;
      if (p <= 0.1) { acc26 += p; return; }
      var yTop = yPos(acc26 + p);
      var yBottom = yPos(acc26);
      var h = yBottom - yTop;
      svg+='<rect x="'+(xBase+barW+gapYear)+'" y="'+yTop+'" width="'+barW+'" height="'+Math.max(0.5,h)+'" fill="'+C[se]+'" opacity="0.85" rx="1">'+
        '<title>2026 '+se+' W'+w+': '+p.toFixed(1)+'%</title></rect>';
      acc26 += p;
    });
    
    // Week label (centered between the two bars)
    var xLabel = xBase + barW + gapYear/2;
    svg+='<text class="stl" x="'+xLabel+'" y="'+(ch-padding.bottom+16)+'" text-anchor="middle">W'+w+'</text>';
  });
  
  // Separator line between 2025 and 2026 bars (label area)
  var sepX = padding.left + barW + gapYear/2;
  svg+='<line x1="'+sepX+'" y1="'+(ch-padding.bottom)+'" x2="'+sepX+'" y2="'+(ch-padding.bottom+4)+'" stroke="'+A25+'" stroke-width="2" opacity="0.4"/>';
  
  // Legend
  var lx=padding.left+4,ly=ch-padding.bottom+36;
  // Year indicators
  svg+='<rect x="'+lx+'" y="'+ly+'" width="12" height="12" fill="var(--text2)" opacity="0.25" rx="2"/><text class="stl" x="'+(lx+16)+'" y="'+(ly+10)+'">2025 (浅色)</text>';
  lx+=100;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="12" height="12" fill="var(--text2)" opacity="0.8" rx="2"/><text class="stl" x="'+(lx+16)+'" y="'+(ly+10)+'">2026 (深色)</text>';
  lx+=110;
  SEASONS.forEach(function(se){
    svg+='<rect x="'+lx+'" y="'+ly+'" width="12" height="12" fill="'+C[se]+'" rx="2"/><text class="stl" x="'+(lx+16)+'" y="'+(ly+10)+'">'+se+'</text>';
    lx+=45;
  });
  
  svg+='</svg>';
  
  document.getElementById('weeklyChartTitle').textContent = store+' · '+gm.length+'个月 · '+nw+'周 · 100%堆叠季节占比';
  document.getElementById('weeklySvg').innerHTML = svg;
}

// === Autumn chart (4-store comparison) ===
function renderAutumnChart() {
  var aw=autumnWeeks, as=autumnStores, ase=autumnSeasons;
  var eff = getEffData(globalMonths, aw);
  
  var ch=440, padding={top:20,right:16,bottom:80,left:50};
  var stores=as;
  var barW=16, groupGap=24, gap=4;
  var cw=(barW*2+gap)*stores.length*aw.length+groupGap*(aw.length-1);
  
  function yPos(v){return padding.top+(100-v)/100*(ch-padding.top-padding.bottom);}
  
  if(aw.length===0||stores.length===0||ase.length===0) {
    document.getElementById('autumnSvg').innerHTML='<p style="color:var(--text3);padding:20px;">请选择至少一个周、店铺和季节</p>';
    return;
  }
  
  var wss = computeWeekSeason(eff);
  
  var svg='<svg width="'+Math.max(680,cw+padding.left+padding.right+80)+'" height="'+(ch+10)+'" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<=5;i++){var v=i*20,y=yPos(v);svg+='<line x1="'+padding.left+'" y1="'+y+'" x2="'+(padding.left+cw)+'" y2="'+y+'" stroke="#e8ecf0" stroke-dasharray="3,3"/>';svg+='<text class="ax" x="'+(padding.left-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'%</text>';}
  
  var xi=0;
  aw.forEach(function(w) {
    stores.forEach(function(store,si) {
      var p25=0,p26=0;
      wss.forEach(function(r) {
        if(r.w===w && r.s===store && ase.indexOf(r.se)>=0) {
          if(r.y===2025) p25+=r.p;
          else p26+=r.p;
        }
      });
      
      var x=padding.left+xi*(barW*2+gap)+groupGap*(Math.floor(xi/stores.length));
      var h25=yPos(p25),rh25=ch-padding.bottom-h25;
      svg+='<rect x="'+x+'" y="'+(rh25>0?h25:ch-padding.bottom)+'" width="'+barW+'" height="'+Math.max(1,rh25)+'" fill="'+A25+'" opacity="0.5" rx="2"><title>2025 '+store+' W'+w+': '+p25.toFixed(1)+'%</title></rect>';
      var h26=yPos(p26),rh26=ch-padding.bottom-h26;
      x+=barW+gap;
      svg+='<rect x="'+x+'" y="'+(rh26>0?h26:ch-padding.bottom)+'" width="'+barW+'" height="'+Math.max(1,rh26)+'" fill="'+A26+'" rx="2"><title>2026 '+store+' W'+w+': '+p26.toFixed(1)+'%</title></rect>';
      
      xi++;
    });
  });
  
  xi=0;
  aw.forEach(function(w){
    stores.forEach(function(store,si){
      var x=padding.left+xi*(barW*2+gap)+groupGap*(Math.floor(xi/stores.length))+barW+gap/2;
      svg+='<text class="stl" x="'+x+'" y="'+(ch-padding.bottom+16)+'" text-anchor="middle" transform="rotate(-30,'+x+','+(ch-padding.bottom+16)+')">'+store.substring(0,6)+' W'+w+'</text>';
      xi++;
    });
  });
  
  var lx=padding.left,ly=ch-padding.bottom+42;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="'+A25+'" opacity="0.5" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">2025</text>';
  lx+=70;
  svg+='<rect x="'+lx+'" y="'+ly+'" width="14" height="14" fill="'+A26+'" rx="2"/><text class="stl" x="'+(lx+18)+'" y="'+(ly+11)+'">2026</text>';
  
  svg+='</svg>';
  
  var titleStr = ase.join('/')+'导入进度 · '+stores.join('/')+' · ('+
    (aw.length>0?('W'+aw[0]+'-W'+aw[aw.length-1]):'')+'周)';
  document.getElementById('autumnChartTitle').textContent = titleStr;
  document.getElementById('autumnSvg').innerHTML = svg;
}

// === Summary table ===
function renderSummaryTable() {
  var sm=summMonths, sw=summWeeks;
  var eff = getEffData(sm, sw);
  
  var html='<table class="summary-table"><thead><tr>'+
    '<th>店铺</th><th>季节</th>'+
    '<th>2025销售金额</th><th>2025占比</th>'+
    '<th>2026销售金额</th><th>2026占比</th>'+
    '<th>占比变化</th></tr></thead><tbody>';
  
  STORES.forEach(function(store) {
    var d25=eff.filter(function(r){return r.s===store && r.y===2025;});
    var d26=eff.filter(function(r){return r.s===store && r.y===2026;});
    
    var wmap25={},wmap26={};
    d25.forEach(function(r){wmap25[r.w]=Math.max(wmap25[r.w]||0,r.ta);});
    d26.forEach(function(r){wmap26[r.w]=Math.max(wmap26[r.w]||0,r.ta);});
    var t25=0,t26=0;
    for(var k in wmap25) t25+=wmap25[k];
    for(var k in wmap26) t26+=wmap26[k];
    
    html+='<tr class="store-header"><td colspan="7">'+store+'</td></tr>';
    
    SEASONS.forEach(function(se) {
      var a25=0,a26=0;
      d25.forEach(function(r){if(r.se===se)a25+=r.a;});
      d26.forEach(function(r){if(r.se===se)a26+=r.a;});
      var p25=t25>0?(a25/t25*100):0;
      var p26=t26>0?(a26/t26*100):0;
      var diff=p26-p25;
      var dcls=diff>0.1?'diff-pos':(diff<-0.1?'diff-neg':'diff-zero');
      html+='<tr><td></td><td>'+se+'</td>'+
        '<td>'+fmtK(a25)+'</td><td>'+p25.toFixed(1)+'%</td>'+
        '<td>'+fmtK(a26)+'</td><td>'+p26.toFixed(1)+'%</td>'+
        '<td class="'+dcls+'">'+(diff>=0?'+':'')+diff.toFixed(1)+'%</td></tr>';
    });
    
    var totG=(t26-t25)/t25*100;
    var tgCls=totG>0.1?'diff-pos':(totG<-0.1?'diff-neg':'diff-zero');
    html+='<tr class="store-subtotal"><td>Σ 合计</td><td></td>'+
      '<td>'+fmtK(t25)+'</td><td>100.0%</td>'+
      '<td>'+fmtK(t26)+'</td><td>100.0%</td>'+
      '<td class="'+tgCls+'">'+(totG>=0?'+':'')+totG.toFixed(1)+'%</td></tr>';
  });
  
  html+='</tbody></table>';
  document.getElementById('summaryTableWrap').innerHTML = html;
  
  // Update subtitle with selected range info
  var mLabel = sm.length===1 ? (sm[0]+'月') : (sm.length===ALL_MONTHS.length?'全年':(sm[0]+'-'+sm[sm.length-1]+'月'));
  var wLabel = sw.length===1 ? ('W'+sw[0]) : ('W'+sw[0]+'-W'+sw[sw.length-1]);
  document.getElementById('summaryTableSubtitle').textContent = mLabel+' · '+wLabel+' · 同期对比';
}
